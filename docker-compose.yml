x-gpu: &gpu
  gpus: all
  deploy:
    resources:
      reservations:
        devices:
          - driver: nvidia
            capabilities: [gpu]

services:
  # Head-only region + classifier training on the frozen honi05 verdict backbone.
  # Trains a small fake/real head AND the region head on frozen features.
  # Place DeepfakeBench-preprocessed FF++ under data/FaceForensics++, then:
  #   docker compose run --rm train
  train:
    build: .
    container_name: rlroinet-train
    # Worker prefetch queues hold several multi-frame batches; the Docker
    # default /dev/shm is too small and causes worker bus errors.
    shm_size: "2gb"
    # Enhanced head uses average+max spatial evidence and the frozen verdict
    # logit, with validation-only checkpoint selection and a review band.
    command: python -m rlroinet.train --verdict honi05 --source ffpp --ffpp-dir data/FaceForensics++ --epochs 20 --batch 64 --classifier --enhanced-classifier --val-sample 300 --checkpoint-dir outputs/checkpoints/latest_training
    <<: *gpu
    volumes:
      - ./data:/app/data
      - ./outputs:/app/outputs
    environment:
      - DEVICE=cuda
      - PYTHONUNBUFFERED=1

  evaluate:
    build: .
    container_name: rlroinet-evaluate
    command: python -m rlroinet.evaluate --source ffpp --ffpp-dir data/FaceForensics++ --checkpoint outputs/checkpoints/best.pt --out outputs/eval_report.json --device cuda
    <<: *gpu
    volumes:
      - ./data:/app/data
      - ./outputs:/app/outputs
    environment:
      - DEVICE=cuda

  # Generalization evaluation: unseen videos + per-method + cross-dataset.
  #   docker compose run --rm generalize
  generalize:
    build: .
    container_name: rlroinet-generalize
    command: python -m rlroinet.generalize --source ffpp --ffpp-dir data/FaceForensics++ --checkpoint outputs/checkpoints/best.pt --out outputs/eval_generalization.json --device cuda
    <<: *gpu
    volumes:
      - ./data:/app/data
      - ./outputs:/app/outputs
    environment:
      - DEVICE=cuda
      - OPENCV_FFMPEG_CAPTURE_OPTIONS=timeout;5000000

  api:
    build: .
    container_name: rlroinet-api
    command: uvicorn rlroinet.api:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    <<: *gpu
    volumes:
      - ./data:/app/data
      - ./outputs:/app/outputs
      - ./uploads:/app/uploads
      - ./website:/app/website
    environment:
      - DEVICE=cuda
      - CHECKPOINT=outputs/checkpoints/best.pt
      - WEBSITE_DIR=website
      - MAX_VIDEO_DURATION_SECONDS=30
      - MAX_UPLOAD_BYTES=262144000
      - UPLOAD_RETENTION_SECONDS=86400
      - MAX_CONCURRENT_ANALYSES=1
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Verdict-model shootout: measure frozen detectors on raw Celeb-DF, pick the
  # winner that becomes the frozen backbone for region-head training.
  # Weights are expected under outputs/models (best_model.pt, xception_best.pth).
  verdict:
    build: .
    container_name: rlroinet-verdict
    command: python -m rlroinet.benchmark_verdict --device cuda
    <<: *gpu
    volumes:
      - ./data:/app/data
      - ./outputs:/app/outputs
    environment:
      - DEVICE=cuda
      - OPENCV_FFMPEG_CAPTURE_OPTIONS=timeout;5000000

  # Frozen-backbone shootout on FF++ held-out (frame-based, no raw videos).
  # Decides which backbone becomes the frozen signal for Phase 2 training.
  backbones:
    build: .
    container_name: rlroinet-backbones
    command: python -m rlroinet.benchmark_backbones --device cuda
    <<: *gpu
    volumes:
      - ./data:/app/data
      - ./outputs:/app/outputs
    environment:
      - DEVICE=cuda

  tests:
    build: .
    container_name: rlroinet-tests
    command: python -m pytest tests -q
    volumes:
      - ./data:/app/data
      - ./outputs:/app/outputs
