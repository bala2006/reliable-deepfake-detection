[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rlroinet"
version = "2.0.0"
description = "Supervised ROI-Net v2: EfficientNet deepfake classification with mask localization"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "torch==2.5.1",
    "torchvision==0.20.1",
    "numpy==1.26.4",
    "opencv-python-headless==4.10.0.84",
    "scikit-learn==1.5.2",
    "fastapi==0.115.6",
    "uvicorn==0.34.0",
    "python-multipart==0.0.20",
    "matplotlib==3.9.3",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[tool.setuptools.packages.find]
include = ["rlroinet*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
